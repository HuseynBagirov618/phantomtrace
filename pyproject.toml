[project]
name = "phantomtrace"
version = "0.1.0"
description = "Evidence-driven cyberattack reconstruction MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.8.2",
    "pytest==8.3.2",
    "python-evtx==0.7.4",
    "networkx==3.3"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]